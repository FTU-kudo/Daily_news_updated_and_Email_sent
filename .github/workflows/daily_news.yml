name: Bao cao tin tuc thi truong hang ngay

on:
  workflow_dispatch: {}

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai dat thu vien he thong cho WeasyPrint + Font chu
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            ttf-mscorefonts-installer fonts-symbola
          sudo fc-cache -f -v

      - name: Cai dat thu vien Python
        run: pip install -r requirements.txt

      - name: Buoc 1 - Lay tin, tom tat AI, xuat PDF (khong gui email)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEDIA_STACK_API_KEY: ${{ secrets.MEDIA_STACK_API_KEY }}
        run: python -u main.py --build

      - name: Buoc 2 - Cho den dung 8h00 sang VN (01:00 UTC)
        run: |
          python3 -c "
          import datetime, time
          now = datetime.datetime.utcnow()
          target = now.replace(hour=1, minute=0, second=0, microsecond=0)
          wait_seconds = (target - now).total_seconds()
          if wait_seconds > 0:
              print(f'Cho {wait_seconds:.0f} giay de den dung 01:00 UTC (08:00 VN)...')
              time.sleep(wait_seconds)
          else:
              print('Da qua 8h00 VN (qua trinh chuan bi mat nhieu thoi gian hon du kien) -> gui email ngay.')
          "

      - name: Buoc 3 - Gui email luc 8h00 sang VN
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: python -u main.py --send-email

      - name: Luu PDF lam Artifact (ban sao du phong, khong bat buoc)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-tin-tuc
          path: "*.pdf"
          retention-days: 7
